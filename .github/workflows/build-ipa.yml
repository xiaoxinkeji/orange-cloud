name: Build Unsigned IPA

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.8.2)"
        required: true
        default: "v1.8.2"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app 2>/dev/null || ls /Applications/ | grep -i xcode || true
          if [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | head -1)
            if [ -z "$XCODE_APP" ]; then
              echo "::error::No Xcode found in /Applications"
              exit 1
            fi
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
          echo "SDK platforms:"
          xcodebuild -showsdks 2>/dev/null | grep -i ios || true

      - name: Cache SPM dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-${{ runner.os }}-${{ hashFiles('apps/ios/Orange Cloud/Orange Cloud.xcodeproj/project.pbxproj') }}
          restore-keys: xcode-${{ runner.os }}-

      - name: Set version info
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${{ github.ref_name }}"
          fi
          echo "tag=$RAW" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "Marketing version kept from upstream project.pbxproj"

      - name: Build archive
        working-directory: apps/ios/Orange Cloud
        run: |
          set -eo pipefail
          echo "=== Building archive ==="
          xcodebuild archive \
            -project "Orange Cloud.xcodeproj" \
            -scheme "Orange Cloud" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/OrangeCloud.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="OPENSOURCE_UNLOCKED"
          echo "=== Build completed ==="

      - name: Collect build logs on failure
        if: failure()
        run: |
          echo "=== Finding Xcode Build Logs ==="
          mkdir -p build-logs
          find ~/Library/Developer/Xcode/DerivedData -name "*.xcactivitylog" | while read -r logfile; do
            name=$(basename "$logfile" .xcactivitylog)
            echo "Decompressing $logfile to build-logs/${name}.txt"
            gunzip -c "$logfile" > "build-logs/${name}.txt" || true
          done
          echo "=== Printing last 200 lines of each log ==="
          find build-logs -name "*.txt" -exec tail -n 200 {} \; || true

      - name: Upload build logs artifact
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: xcode-build-logs
          path: build-logs

      - name: Create unsigned IPA
        id: ipa
        run: |
          set -eo pipefail
          ARCHIVE="$RUNNER_TEMP/OrangeCloud.xcarchive"
          PAYLOAD="$RUNNER_TEMP/Payload"
          TAG="${{ steps.version.outputs.tag }}"
          IPA_PATH="$RUNNER_TEMP/OrangeCloud-$TAG-unsigned.ipa"

          mkdir -p "$PAYLOAD"
          cp -R "$ARCHIVE/Products/Applications/Orange Cloud.app" "$PAYLOAD/"

          # Strip _CodeSignature from ALL levels (top .app + nested extensions)
          find "$PAYLOAD/Orange Cloud.app" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          rm -f "$PAYLOAD/Orange Cloud.app/embedded.mobileprovision" 2>/dev/null || true
          rm -rf "$PAYLOAD/Orange Cloud.app/SC_Info" 2>/dev/null || true

          cd "$RUNNER_TEMP"
          ditto -c -k --keepParent --sequesterRsrc Payload "$IPA_PATH"

          python3 "$GITHUB_WORKSPACE/scripts/verify-ipa.py" --ci "$IPA_PATH"
          ls -lh "$IPA_PATH"

          CKSUM=$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')
          echo "checksum=$CKSUM" >> $GITHUB_OUTPUT
          echo "SHA256: $CKSUM"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: OrangeCloud-unsigned-ipa
          path: ${{ runner.temp }}/OrangeCloud-${{ steps.version.outputs.tag }}-unsigned.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
